# =====================================================================
#  CONFIGURATION DE LA VEILLE "MODES D'INTERVENTION" (MI)
#  Ce fichier se modifie directement dans GitHub (crayon ✏️), sans coder.
#  Règle : garder l'indentation (2 espaces) et les tirets "- ".
# =====================================================================

# --- Albert API (DINUM) ---------------------------------------------
albert:
  base_url: "https://albert.api.etalab.gouv.fr/v1"
  # Modèle utilisé pour lire et qualifier les documents.
  # Alias stables : openweight-medium (Mistral Small 24B), openweight-large (gpt-oss-120b)
  modele: "openweight-medium"
  # Nombre maximum de caractères d'un rapport envoyés à Albert pour l'analyse
  max_caracteres_analyse: 18000
  # Collection Albert où indexer les documents retenus (pour le RAG des étapes suivantes)
  collection: "veille-modes-intervention"

# --- Référentiel de départ ------------------------------------------
referentiel:
  fichier: "data/MI_ademe_ART_enrichi.xlsx"

# --- Périmètre thématique ----------------------------------------------
# Albert écarte tout document qui ne traite pas de ces sujets.
perimetre: >
  Transition écologique au sens large : climat (atténuation et adaptation),
  énergie (efficacité, rénovation, chaleur, électricité, renouvelables, nucléaire),
  sortie des énergies fossiles (carburants, gaz, fioul, charbon, fiscalité énergétique),
  mobilité et transports, industrie bas-carbone, économie circulaire et déchets,
  eau, biodiversité, agriculture et forêt, air, aménagement et sobriété foncière.

# Mots-clés thématiques utilisés pour les recherches "par évaluateur"
themes_fr:
  - rénovation énergétique
  - énergies renouvelables
  - énergies fossiles carburants
  - mobilité transport décarbonation
  - chaleur renouvelable
  - économie circulaire déchets
  - industrie décarbonation
  - fiscalité environnementale
  - adaptation changement climatique
  - biodiversité eau
themes_en:
  - energy transition policy instrument
  - fossil fuel subsidy reform
  - carbon pricing
  - building renovation programme
  - clean transport policy
  - industrial decarbonisation support

