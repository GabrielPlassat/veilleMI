# --- Moteur de recherche web ------------------------------------------
# Albert API ne fait pas de recherche web : on utilise un moteur externe.
# "duckduckgo" : gratuit, sans clé (peut ralentir si trop de requêtes)
# "brave"      : clé gratuite sur https://api-search.brave.com (plus fiable)
recherche:
  moteur: "duckduckgo"
  resultats_par_requete: 8
  pause_entre_requetes_s: 2.0
  # true = ne garder que les résultats venant des domaines listés ci-dessus
  domaines_connus_seulement: true

# --- Téléchargement ----------------------------------------------------
telechargement:
  dossier: "veille_MI"          # dossier racine (dans Google Drive avec Colab)
  taille_max_mo: 60
  pdf_max_par_page: 3           # nb max de PDF récupérés sur une page web
